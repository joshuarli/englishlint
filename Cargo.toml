[package]
name = "englishlint"
version = "0.1.0"
edition = "2021"
description = "A deterministic linter for clear technical English in Markdown"
license = "MIT"

[dependencies]
ignore = "0.4"
pulldown-cmark = "0.13"

[profile.dev]
debug = 0
strip = "debuginfo"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true

